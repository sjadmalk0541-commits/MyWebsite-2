<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وب‌سایت من</title>

    <style>
        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #101827, #263b5e);
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #0b1220;
        }

        main {
            padding: 70px 20px;
        }

        h1 {
            color: #54d6ff;
            font-size: 32px;
        }

        p {
            font-size: 18px;
            line-height: 2;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background: #54d6ff;
            color: #101827;
            font-size: 17px;
            cursor: pointer;
        }

        footer {
            padding: 20px;
            background: #0b1220;
        }
    </style>
</head>

<body>
    <header>
        <h2>وب‌سایت شخصی من</h2>
    </header>

    <main>
        <h1>سلام، خوش اومدی! 👋</h1>

        <p>
            این اولین وب‌سایت منه که با HTML و CSS ساختم.
            <br>
            به سایت من خوش اومدی!
        </p>

        <button onclick="alert('سلام رفیق! 👋')">
            کلیک کن
        </button>
    </main>

    <footer>
        ساخته‌شده با علاقه ❤️
    </footer>
</body>
</html>
